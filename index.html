<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificação de Atestado</title>
  <style>
    :root {
      --green: #16834a;
      --green-dark: #10683a;
      --ink: #17221c;
      --muted: #66736b;
      --border: #dce5df;
      --surface: #ffffff;
      --bg: #f3f7f4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 10%, rgba(22,131,74,.09), transparent 28rem),
        var(--bg);
    }
    .card {
      width: min(100%, 480px);
      padding: clamp(28px, 6vw, 44px);
      background: var(--surface);
      border: 1px solid rgba(220,229,223,.9);
      border-radius: 24px;
      box-shadow: 0 24px 70px rgba(23, 54, 35, .09);
    }
    .mark {
      width: 52px; height: 52px;
      display: grid; place-items: center;
      margin: 0 auto 22px;
      border-radius: 16px;
      color: var(--green);
      background: #eaf6ee;
    }
    .mark svg { width: 27px; height: 27px; }
    h1 {
      margin: 0;
      text-align: center;
      font-size: clamp(1.45rem, 5vw, 1.85rem);
      line-height: 1.2;
      letter-spacing: -.045em;
      font-weight: 800;
    }
    .subtitle {
      margin: 12px 0 30px;
      color: var(--muted);
      text-align: center;
      font-size: .9rem;
      font-weight: 650;
      letter-spacing: .055em;
    }
    label {
      display: block;
      margin-bottom: 9px;
      font-size: .88rem;
      font-weight: 700;
    }
    input {
      width: 100%;
      height: 54px;
      padding: 0 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      font: inherit;
      font-size: 1rem;
      transition: border-color .2s, box-shadow .2s;
    }
    input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 4px rgba(22,131,74,.12);
    }
    button {
      width: 100%;
      min-height: 54px;
      margin-top: 14px;
      border: 0;
      border-radius: 12px;
      color: white;
      background: var(--green);
      font: inherit;
      font-weight: 800;
      letter-spacing: .04em;
      cursor: pointer;
      transition: background .2s, transform .2s;
    }
    button:hover { background: var(--green-dark); }
    button:active { transform: scale(.99); }
    .result {
      display: none;
      margin-top: 22px;
      padding: 18px;
      border-radius: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
    .result.error {
      color: #9f2525;
      background: #fff0f0;
      border: 1px solid #f5d0d0;
    }
    .result.success {
      display: block;
      color: #175c35;
      background: #f0faf3;
      border: 1px solid #cfe9d7;
    }
    .status-heading {
      margin: 0 0 14px;
      font-size: .92rem;
      font-weight: 850;
      letter-spacing: .015em;
    }
    .record-name { margin: 0 0 10px; font-weight: 800; }
    .record-line { margin: 6px 0 0; font-size: .94rem; }
    .status-pill {
      display: inline-block;
      margin-top: 12px;
      padding: 5px 10px;
      border-radius: 999px;
      background: #d9f3e1;
      font-size: .82rem;
      font-weight: 800;
    }
    .footnote {
      margin: 22px 0 0;
      color: #859088;
      text-align: center;
      font-size: .75rem;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 3.5h7l4 4V20a1 1 0 0 1-1 1H7a2 2 0 0 1-2-2V5.5a2 2 0 0 1 2-2Z"/>
        <path d="M14 3.5V8h4M8 13l2.5 2.5L16 10"/>
      </svg>
    </div>
    <h1>VERIFIQUE SEU ATESTADO</h1>
    <p class="subtitle">DIGITE O CÓDIGO FORNECIDO</p>

    <form id="verify-form" novalidate>
      <label for="code">Código de verificação</label>
      <input id="code" name="code" type="text" inputmode="numeric" autocomplete="off" placeholder="Digite o código" aria-describedby="result">
      <button type="submit">VERIFICAR</button>
    </form>

    <section id="result" class="result" role="status" aria-live="polite"></section>
    <p class="footnote">Digite o código informado para consultar o registro.</p>
  </main>

  <script>
    const form = document.getElementById('verify-form');
    const input = document.getElementById('code');
    const result = document.getElementById('result');

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      const code = input.value.trim();

      if (code === '3518') {
        result.className = 'result success';
        result.innerHTML = `
          <p class="status-heading">DOCUMENTO ENCONTRADO COM SUCESSO</p>
          <p class="record-name">EMANUELY VITÓRIA TRAJANO SOARES</p>
          <p class="record-line"><strong>Data:</strong> 20/10/2026</p>
          <span class="status-pill">Situação: Regular</span>
        `;
      } else {
        result.className = 'result error';
        result.textContent = 'DOCUMENTO NÃO ENCONTRADO';
      }
    });
  </script>
</body>
</html>
